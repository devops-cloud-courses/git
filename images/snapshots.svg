<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="snapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="940" height="390" rx="16" fill="#f8fafc"/>

  <!-- Top Timeline Arrow -->
  <text x="470" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af" letter-spacing="0.04em">CHECKINS OVER TIME (GIT SNAPSHOT STREAM)</text>
  <line x1="40" y1="42" x2="900" y2="42" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSlate)"/>

  <!-- Vertical Snapshot Lines -->
  <line x1="112" y1="108" x2="112" y2="340" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="290" y1="108" x2="290" y2="340" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="470" y1="108" x2="470" y2="340" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="650" y1="108" x2="650" y2="340" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="828" y1="108" x2="828" y2="340" stroke="#93c5fd" stroke-width="2.5"/>

  <!-- Version Headers -->
  <g filter="url(#shadow)">
    <rect x="40" y="60" width="144" height="48" rx="24" fill="url(#snapGrad)"/>
    <text x="112" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Version 1</text>

    <rect x="218" y="60" width="144" height="48" rx="24" fill="url(#snapGrad)"/>
    <text x="290" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Version 2</text>

    <rect x="398" y="60" width="144" height="48" rx="24" fill="url(#snapGrad)"/>
    <text x="470" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Version 3</text>

    <rect x="578" y="60" width="144" height="48" rx="24" fill="url(#snapGrad)"/>
    <text x="650" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Version 4</text>

    <rect x="756" y="60" width="144" height="48" rx="24" fill="url(#snapGrad)"/>
    <text x="828" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Version 5</text>
  </g>

  <!-- Row 1: File A -->
  <g filter="url(#shadow)">
    <rect x="40" y="142" width="144" height="52" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="112" y="174" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">File A</text>

    <rect x="218" y="142" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="174" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">A1</text>

    <rect x="398" y="142" width="144" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="470" y="174" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">A1</text>

    <rect x="578" y="142" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="650" y="174" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">A2</text>

    <rect x="756" y="142" width="144" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="828" y="174" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">A2</text>
  </g>

  <!-- Row 2: File B -->
  <g filter="url(#shadow)">
    <rect x="40" y="222" width="144" height="52" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="112" y="254" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">File B</text>

    <rect x="218" y="222" width="144" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="290" y="254" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">B</text>

    <rect x="398" y="222" width="144" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="470" y="254" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">B</text>

    <rect x="578" y="222" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="650" y="254" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">B1</text>

    <rect x="756" y="222" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="828" y="254" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">B2</text>
  </g>

  <!-- Row 3: File C -->
  <g filter="url(#shadow)">
    <rect x="40" y="302" width="144" height="52" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="112" y="334" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">File C</text>

    <rect x="218" y="302" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="334" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">C1</text>

    <rect x="398" y="302" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="470" y="334" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">C2</text>

    <rect x="578" y="302" width="144" height="52" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="650" y="334" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">C2</text>

    <rect x="756" y="302" width="144" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="828" y="334" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">C3</text>
  </g>
</svg>
