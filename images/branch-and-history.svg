<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="snapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="16" fill="#f8fafc"/>

  <!-- HEAD -> main arrow -->
  <line x1="785" y1="78" x2="785" y2="112" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>

  <!-- v1.0 & main -> f30ab arrows -->
  <line x1="590" y1="168" x2="650" y2="214" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="765" y1="168" x2="715" y2="214" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>

  <!-- Commit Parent Arrows -->
  <line x1="365" y1="250" x2="255" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="595" y1="250" x2="545" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>

  <!-- Commit -> Snapshot Arrows -->
  <line x1="160" y1="280" x2="160" y2="322" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="450" y1="280" x2="450" y2="322" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="680" y1="280" x2="680" y2="322" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>

  <!-- Pointers (HEAD, v1.0, main) -->
  <g filter="url(#shadow)">
    <rect x="695" y="26" width="180" height="52" rx="12" fill="url(#headGrad)"/>
    <text x="785" y="59" text-anchor="middle" font-size="17" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">HEAD</text>

    <rect x="490" y="118" width="180" height="52" rx="12" fill="url(#branchGrad)"/>
    <text x="580" y="151" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">v1.0</text>

    <rect x="695" y="118" width="180" height="52" rx="12" fill="url(#branchGrad)"/>
    <text x="785" y="151" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">main</text>
  </g>

  <!-- Commit Nodes -->
  <g filter="url(#shadow)">
    <rect x="75" y="220" width="170" height="60" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="160" y="257" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e1b4b">98ca9</text>

    <rect x="365" y="220" width="170" height="60" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="450" y="257" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e1b4b">34ac2</text>

    <rect x="595" y="220" width="170" height="60" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="680" y="257" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e1b4b">f30ab</text>
  </g>

  <!-- Snapshot Nodes -->
  <g filter="url(#shadow)">
    <rect x="75" y="330" width="170" height="58" rx="14" fill="url(#snapGrad)"/>
    <text x="160" y="366" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Snapshot A</text>

    <rect x="365" y="330" width="170" height="58" rx="14" fill="url(#snapGrad)"/>
    <text x="450" y="366" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Snapshot B</text>

    <rect x="595" y="330" width="170" height="58" rx="14" fill="url(#snapGrad)"/>
    <text x="680" y="366" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Snapshot C</text>
  </g>
</svg>
