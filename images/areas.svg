<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="workGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="repoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="16" fill="#f8fafc"/>

  <!-- Lifelines -->
  <line x1="160" y1="110" x2="160" y2="390" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="460" y1="110" x2="460" y2="390" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="760" y1="110" x2="760" y2="390" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Column Headers -->
  <g filter="url(#shadow)">
    <rect x="40" y="28" width="240" height="82" rx="16" fill="url(#workGrad)"/>
    <text x="160" y="64" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Working</text>
    <text x="160" y="90" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Directory</text>

    <rect x="340" y="28" width="240" height="82" rx="16" fill="url(#stageGrad)"/>
    <text x="460" y="64" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Staging Area</text>
    <text x="460" y="90" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#e0f2fe">(Index)</text>

    <rect x="640" y="28" width="240" height="82" rx="16" fill="url(#repoGrad)"/>
    <text x="760" y="64" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">.git Directory</text>
    <text x="760" y="90" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#e0e7ff">(Repository)</text>
  </g>

  <!-- Step 1: Checkout the project (.git -> Working Directory) -->
  <line x1="756" y1="168" x2="172" y2="168" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrIndigo)"/>
  <g filter="url(#shadow)">
    <rect x="315" y="146" width="290" height="44" rx="22" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <circle cx="342" cy="168" r="13" fill="#4f46e5"/>
    <text x="342" y="173" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
    <text x="472" y="174" text-anchor="middle" font-size="15.5" font-weight="700" fill="#312e81">Checkout the project</text>
  </g>

  <!-- Step 2: Stage Fixes (Working Directory -> Staging Area) -->
  <line x1="164" y1="256" x2="448" y2="256" stroke="#ea580c" stroke-width="4" marker-end="url(#arrOrange)"/>
  <g filter="url(#shadow)">
    <rect x="195" y="234" width="230" height="44" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <circle cx="222" cy="256" r="13" fill="#ea580c"/>
    <text x="222" y="261" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
    <text x="322" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9a3412">Stage fixes (git add)</text>
  </g>

  <!-- Step 3: Commit (Staging Area -> .git Directory) -->
  <line x1="464" y1="344" x2="748" y2="344" stroke="#2563eb" stroke-width="4" marker-end="url(#arrBlue)"/>
  <g filter="url(#shadow)">
    <rect x="495" y="322" width="230" height="44" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="522" cy="344" r="13" fill="#2563eb"/>
    <text x="522" y="349" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
    <text x="622" y="350" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e40af">Commit (git commit)</text>
  </g>

  <!-- Endpoint Dots -->
  <circle cx="760" cy="168" r="6" fill="#4f46e5"/>
  <circle cx="160" cy="256" r="6" fill="#ea580c"/>
  <circle cx="460" cy="344" r="6" fill="#2563eb"/>
</svg>
