<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="commitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Commit Parent Arrows -->
  <line x1="130" y1="128" x2="130" y2="184" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="130" y1="264" x2="130" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>

  <!-- Commit -> Tree Arrows -->
  <line x1="230" y1="88" x2="314" y2="88" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="230" y1="224" x2="314" y2="224" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="230" y1="360" x2="314" y2="360" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>

  <!-- Tree -> Blob / Subtree Arrows -->
  <!-- 3c4e9c -> deploy/ (d8329f) -->
  <polyline points="484,64 530,24 930,24 930,416 450,416 420,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>
  <rect x="546" y="11" width="86" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="589" y="29" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">deploy/</text>

  <!-- 3c4e9c -> Dockerfile (fa49b0) -->
  <polyline points="494,82 900,82 900,265 866,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>
  <rect x="530" y="69" width="108" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="584" y="87" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">Dockerfile</text>

  <!-- 3c4e9c -> main.go (1f7a7a) -->
  <line x1="494" y1="104" x2="664" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>
  <rect x="524" y="109" width="104" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="127" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">main.go</text>

  <!-- 0155eb -> main.go (1f7a7a) -->
  <line x1="494" y1="210" x2="664" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>
  <rect x="524" y="182" width="104" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="200" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">main.go</text>

  <!-- 0155eb -> Dockerfile (fa49b0) -->
  <line x1="494" y1="238" x2="664" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arrSlate)"/>
  <rect x="530" y="236" width="108" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="584" y="254" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">Dockerfile</text>

  <!-- d8329f -> main.go (83baae) -->
  <line x1="494" y1="360" x2="664" y2="360" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <rect x="524" y="347" width="104" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="576" y="365" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">main.go</text>

  <!-- Commits Column -->
  <g filter="url(#shadow)">
    <rect x="30" y="48" width="200" height="80" rx="14" fill="url(#commitGrad)"/>
    <text x="50" y="74" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#fef3c7">1a410e</text>
    <text x="130" y="104" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">third commit</text>

    <rect x="30" y="184" width="200" height="80" rx="14" fill="url(#commitGrad)"/>
    <text x="50" y="210" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#fef3c7">cac0ca</text>
    <text x="130" y="240" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">second commit</text>

    <rect x="30" y="320" width="200" height="80" rx="14" fill="url(#commitGrad)"/>
    <text x="50" y="346" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#fef3c7">fdf4fc</text>
    <text x="130" y="376" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">first commit</text>
  </g>

  <!-- Trees Column -->
  <g filter="url(#shadow)">
    <rect x="320" y="48" width="174" height="80" rx="14" fill="url(#treeGrad)"/>
    <text x="340" y="74" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#e0f2fe">3c4e9c</text>
    <text x="407" y="104" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">tree</text>

    <rect x="320" y="184" width="174" height="80" rx="14" fill="url(#treeGrad)"/>
    <text x="340" y="210" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#e0f2fe">0155eb</text>
    <text x="407" y="240" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">tree</text>

    <rect x="320" y="320" width="174" height="80" rx="14" fill="url(#treeGrad)"/>
    <text x="340" y="346" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#e0f2fe">d8329f</text>
    <text x="407" y="376" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">tree</text>
  </g>

  <!-- Blobs Column -->
  <g filter="url(#shadow)">
    <rect x="670" y="128" width="190" height="76" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="690" y="153" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">1f7a7a (blob)</text>
    <text x="765" y="182" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">"version 2"</text>

    <rect x="670" y="226" width="190" height="76" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="690" y="251" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">fa49b0 (blob)</text>
    <text x="765" y="280" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">"new file"</text>

    <rect x="670" y="322" width="190" height="76" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="690" y="347" font-size="12.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">83baae (blob)</text>
    <text x="765" y="376" text-anchor="middle" font-size="16" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">"version 1"</text>
  </g>
