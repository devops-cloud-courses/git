<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Top Card: git reset HEAD~1 (Local History Rewrite) -->
  <g filter="url(#shadow)">
    <rect x="24" y="20" width="912" height="190" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="24" y="20" width="912" height="42" rx="14" fill="#fffbeb"/>
    <text x="48" y="47" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#b45309">1. git reset HEAD~1</text>
    <text x="912" y="47" text-anchor="end" font-size="13" font-weight="700" fill="#d97706">Moves branch pointer backward (Local branches only)</text>
  </g>

  <!-- Reset Commit Chain: C1 <- C2 <- C3 (faded) -->
  <line x1="255" y1="130" x2="185" y2="130" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="455" y1="130" x2="385" y2="130" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrSlate)"/>

  <!-- Pointer Move Curve from C3 back to C2 -->
  <path d="M 510 92 C 470 58, 390 58, 345 90" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrAmber)"/>
  <text x="428" y="62" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#b45309">HEAD moves back</text>

  <g filter="url(#shadow)">
    <rect x="75" y="100" width="105" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="127" y="135" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e3a8a">C1</text>

    <rect x="265" y="100" width="115" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="322" y="135" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e3a8a">C2</text>

    <rect x="272" y="166" width="100" height="30" rx="8" fill="#d97706"/>
    <text x="322" y="186" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">HEAD / main</text>
  </g>

  <!-- Orphaned C3 -->
  <g opacity="0.55">
    <rect x="455" y="100" width="105" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="507" y="135" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#64748b">C3</text>
    <text x="507" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Unreferenced</text>
  </g>

  <!-- 3 Modes Summary Box inside Top Card -->
  <rect x="605" y="75" width="305" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="622" y="101" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">--soft</text>
  <text x="705" y="101" font-size="13" font-weight="600" fill="#334155">Keeps changes Staged</text>
  <text x="622" y="134" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#2563eb">--mixed</text>
  <text x="705" y="134" font-size="13" font-weight="600" fill="#334155">Keeps Working Dir (default)</text>
  <text x="622" y="167" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#dc2626">--hard</text>
  <text x="705" y="167" font-size="13" font-weight="600" fill="#dc2626">Discards all changes (!)</text>

  <!-- Bottom Card: git revert C3 (Safe for Shared Branches) -->
  <g filter="url(#shadow)">
    <rect x="24" y="230" width="912" height="190" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="24" y="230" width="912" height="42" rx="14" fill="#ecfdf5"/>
    <text x="48" y="257" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#065f46">2. git revert C3</text>
    <text x="912" y="257" text-anchor="end" font-size="13" font-weight="700" fill="#059669">Adds a new inverse commit C3' (Safe for shared / public branches)</text>
  </g>

  <!-- Revert Commit Chain: C1 <- C2 <- C3 <- C3' -->
  <line x1="255" y1="340" x2="185" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="445" y1="340" x2="375" y2="340" stroke="#475569" stroke-width="3" marker-end="url(#arrSlate)"/>
  <line x1="645" y1="340" x2="565" y2="340" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>

  <!-- Forward Pointer Curve from C3 to C3' -->
  <path d="M 505 302 C 555 270, 645 270, 695 300" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
  <text x="600" y="275" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#065f46">Inverts C3 changes</text>

  <g filter="url(#shadow)">
    <rect x="75" y="310" width="105" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="127" y="345" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e3a8a">C1</text>

    <rect x="265" y="310" width="105" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="317" y="345" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e3a8a">C2</text>

    <rect x="455" y="310" width="105" height="56" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="507" y="345" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#991b1b">C3</text>

    <rect x="655" y="310" width="125" height="56" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="717" y="345" text-anchor="middle" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#065f46">C3' (!C3)</text>

    <rect x="667" y="376" width="100" height="30" rx="8" fill="#059669"/>
    <text x="717" y="396" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">HEAD / main</text>
  </g>
</svg>