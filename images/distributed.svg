<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="srvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="filePill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="16" fill="#f8fafc"/>

  <!-- Top: Server Computer -->
  <g filter="url(#shadow)">
    <rect x="320" y="18" width="280" height="196" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="336" y="30" width="248" height="34" rx="8" fill="url(#srvGrad)"/>
    <text x="460" y="52" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Server Computer (Remote)</text>

    <rect x="342" y="72" width="236" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="460" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Version Database</text>
    <line x1="460" y1="112" x2="460" y2="180" stroke="#94a3b8" stroke-width="2"/>

    <rect x="390" y="100" width="140" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="460" y="117" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">Version 3</text>

    <rect x="390" y="133" width="140" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="460" y="150" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 2</text>

    <rect x="390" y="166" width="140" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="460" y="183" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 1</text>
  </g>

  <!-- Bottom Left: Computer A -->
  <g filter="url(#shadow)">
    <rect x="44" y="218" width="270" height="224" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="179" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Computer A</text>

    <rect x="114" y="254" width="130" height="34" rx="17" fill="url(#filePill)"/>
    <text x="179" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Working File</text>

    <line x1="179" y1="306" x2="179" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrSlate)"/>

    <rect x="64" y="306" width="230" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="179" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Full Version Database</text>
    <line x1="179" y1="344" x2="179" y2="412" stroke="#94a3b8" stroke-width="2"/>

    <rect x="109" y="332" width="140" height="25" rx="12.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="179" y="349" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">Version 3</text>

    <rect x="109" y="364" width="140" height="25" rx="12.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="179" y="381" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 2</text>

    <rect x="109" y="396" width="140" height="25" rx="12.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="179" y="413" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 1</text>
  </g>

  <!-- Bottom Right: Computer B -->
  <g filter="url(#shadow)">
    <rect x="606" y="218" width="270" height="224" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="741" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Computer B</text>

    <rect x="676" y="254" width="130" height="34" rx="17" fill="url(#filePill)"/>
    <text x="741" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Working File</text>

    <line x1="741" y1="306" x2="741" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arrSlate)"/>

    <rect x="626" y="306" width="230" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="741" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Full Version Database</text>
    <line x1="741" y1="344" x2="741" y2="412" stroke="#94a3b8" stroke-width="2"/>

    <rect x="671" y="332" width="140" height="25" rx="12.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="741" y="349" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">Version 3</text>

    <rect x="671" y="364" width="140" height="25" rx="12.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="741" y="381" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 2</text>

    <rect x="671" y="396" width="140" height="25" rx="12.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="741" y="413" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#334155">Version 1</text>
  </g>

  <!-- Bidirectional Sync Arrows -->
  <line x1="265" y1="212" x2="342" y2="152" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="655" y1="212" x2="578" y2="152" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="322" y1="365" x2="598" y2="365" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>

  <rect x="405" y="352" width="110" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="460" y="369" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">push / pull</text>
</svg>
