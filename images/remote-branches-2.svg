  <line x1="396" y1="344" x2="362" y2="344" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="562" y1="344" x2="528" y2="344" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="728" y1="344" x2="694" y2="344" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>

