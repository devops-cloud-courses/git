    <text x="293" y="350" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">a6b4c</text>

    <rect x="396" y="322" width="126" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="459" y="350" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">f4265</text>

    <rect x="562" y="322" width="126" height="44" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="625" y="350" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#b91c1c">a38de</text>

