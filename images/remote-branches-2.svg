<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="remoteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="450" rx="16" fill="#f8fafc"/>

  <!-- Top Container: Remote Server -->
  <rect x="36" y="18" width="848" height="184" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="460" y="46" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e40af">git.ourcompany.com (Someone else pushes 2 commits)</text>

  <line x1="230" y1="136" x2="196" y2="136" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="396" y1="136" x2="362" y2="136" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="562" y1="136" x2="528" y2="136" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
