    <text x="791" y="81" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">main</text>

    <rect x="64" y="114" width="126" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="127" y="142" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">0b743</text>

    <rect x="230" y="114" width="126" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="293" y="142" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">a6b4c</text>

    <rect x="396" y="114" width="126" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="459" y="142" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">f4265</text>

    <rect x="562" y="114" width="126" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="625" y="142" text-anchor="middle" font-size="14.5" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1d4ed8">31b8e</text>

