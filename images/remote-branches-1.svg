<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="branchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="remoteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="450" rx="16" fill="#f8fafc"/>

  <!-- Top Container: Remote Server -->
  <rect x="36" y="18" width="848" height="162" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="460" y="46" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e40af">github.com/org/project (Remote Repository)</text>

  <line x1="296" y1="132" x2="250" y2="132" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="486" y1="132" x2="440" y2="132" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="556" y1="90" x2="556" y2="104" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>

  <g filter="url(#shadow)">
    <rect x="490" y="54" width="132" height="36" rx="8" fill="url(#branchGrad)"/>
    <text x="556" y="77" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">main</text>

    <rect x="104" y="110" width="140" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="174" y="138" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">0b743</text>

    <rect x="296" y="110" width="140" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="366" y="138" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">a6b4c</text>

    <rect x="486" y="110" width="140" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="556" y="138" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1d4ed8">f4265</text>
  </g>

  <!-- Clone Action Arrow -->
  <line x1="270" y1="180" x2="270" y2="226" stroke="#2563eb" stroke-width="4" marker-end="url(#arrBlue)"/>
  <rect x="300" y="188" width="490" height="32" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="545" y="209" text-anchor="middle" font-size="13.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">git clone git@github.com:org/project.git</text>

  <!-- Bottom Container: My Computer -->
  <rect x="36" y="234" width="848" height="198" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="260" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">My Computer (Local Repository)</text>

  <line x1="296" y1="344" x2="250" y2="344" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="486" y1="344" x2="440" y2="344" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="556" y1="304" x2="556" y2="316" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>
  <line x1="556" y1="384" x2="556" y2="372" stroke="#475569" stroke-width="2.5" marker-end="url(#arrSlate)"/>

  <g filter="url(#shadow)">
    <rect x="476" y="268" width="160" height="36" rx="8" fill="url(#remoteGrad)"/>
    <text x="556" y="291" text-anchor="middle" font-size="13.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">origin/main</text>
    <text x="652" y="291" font-size="13" font-weight="600" fill="#475569">Remote-tracking branch</text>

    <rect x="104" y="322" width="140" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="174" y="350" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">0b743</text>

    <rect x="296" y="322" width="140" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="366" y="350" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#0f172a">a6b4c</text>

    <rect x="486" y="322" width="140" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="556" y="350" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1d4ed8">f4265</text>

    <rect x="490" y="384" width="132" height="36" rx="8" fill="url(#branchGrad)"/>
    <text x="556" y="407" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">main</text>
    <text x="640" y="407" font-size="13" font-weight="600" fill="#475569">Local working branch</text>
  </g>
</svg>
